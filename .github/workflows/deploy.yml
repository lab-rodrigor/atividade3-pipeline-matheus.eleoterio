name: Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SLUG: matheus-eleoterio
  PORTA: 23210

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar acesso SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gr.lab.ayty.org >> ~/.ssh/known_hosts

      - name: 1. Derrubar a topologia antiga
        run: |
          # 'rm -f' para e remove os containers separadamente. '|| true' ignora erros.
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker stop banco || true
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm banco || true
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker stop api || true
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm api || true
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker stop front || true
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker rm front || true

      - name: 2. Criar as duas redes e o volume
        run: |
          # Tenta criar as redes e volume; ignora o erro se eles já existirem.
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create dados --interna || true
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network create web || true
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker volume create meupgdata || true

      - name: 3. Subir banco, API e front
        run: |
          # a. Subir o banco
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d --name banco --network dados -v meupgdata:/var/lib/postgresql/data -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} -e POSTGRES_DB=pokedex postgres:17-alpine
          
          # b. Subir a API
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d --name api --network dados -e POSTGRES_HOST=gr-${{ env.SLUG }}-banco -e POSTGRES_DB=pokedex -e POSTGRES_PASSWORD=${{ secrets.DB_SENHA }} gr-atv2-api:1
          
          # c. Conectar a API à rede web
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker network connect web api
          
          # d. Subir o front e mapear DEPLOY_SHA
          ssh gr-${{ env.SLUG }}@gr.lab.ayty.org gr-docker run -d --name front --network web -p ${{ env.PORTA }}:80 -e API=gr-${{ env.SLUG }}-api -e DEPLOY_SHA=${{ github.sha }} gr-atv2-front:1

      - name: 4. Conferir que a listagem responde
        run: |
          # Aguarda 20 segundos para dar tempo do banco e API subirem antes do teste
          sleep 20
          
          # Testa se o endereço retorna status 200 (se der 502, falha)
          curl -f http://gr.lab.ayty.org:${{ env.PORTA }}
